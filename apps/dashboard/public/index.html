<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Agent Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a2332;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary: #10b981;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --orange: #f59e0b;
      --pink: #ec4899;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: var(--card-bg);
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 span {
      background: var(--primary);
      color: #000;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .report-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .report-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .report-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }
    .report-summary {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
      color: #cbd5e1;
    }
    .chart-container {
      height: 350px;
      position: relative;
    }
    .format-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-chart { background: rgba(59,130,246,0.15); color: var(--blue); }
    .badge-svg { background: rgba(139,92,246,0.15); color: var(--purple); }
    .badge-d3 { background: rgba(236,72,153,0.15); color: var(--pink); }
    .badge-html { background: rgba(245,158,11,0.15); color: var(--orange); }
    .badge-mixed { background: rgba(16,185,129,0.15); color: var(--primary); }
    .artifact-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--blue); color: #fff; padding: 6px 14px;
      border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600;
      margin-top: 12px; transition: background 0.2s;
    }
    .artifact-link:hover { background: #2563eb; }
    .svg-inline-container { overflow-x: auto; padding: 12px 0; }
    .svg-inline-container svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state div {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .btn {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn:hover { background: #334155; }
    
    /* Loading indicator */
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Global Agent Dashboard <span>Live</span></h1>
    <div>
      <span class="pulse"></span><span style="font-size: 13px; color: var(--text-muted); margin-right: 16px;">Waiting for reports...</span>
      <button class="btn" onclick="clearReports()">Clear History</button>
    </div>
  </div>

  <div class="container" id="reports-container">
    <div class="empty-state">
      <div>📊</div>
      <h3>No reports yet</h3>
      <p>Ask an agent to push a report to the dashboard integration.</p>
    </div>
  </div>

  <script>
    // Configuration for Chart.js
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    
    let currentReports = [];
    
    // Poll for new reports every 2 seconds
    setInterval(fetchReports, 2000);
    fetchReports();
    
    async function fetchReports() {
      try {
        const res = await fetch('/api/reports');
        const reports = await res.json();
        
        // Only re-render if we have new reports
        if (JSON.stringify(reports) !== JSON.stringify(currentReports)) {
          currentReports = reports;
          renderReports();
        }
      } catch (err) {
        console.error('Failed to fetch reports:', err);
      }
    }
    
    async function clearReports() {
      await fetch('/api/reports/clear', { method: 'POST' });
      fetchReports();
    }
    
    function renderReports() {
      const container = document.getElementById('reports-container');
      
      if (currentReports.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div>📊</div>
            <h3>No reports yet</h3>
            <p>Ask an agent to push a report to the dashboard integration.</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = '';
      
      currentReports.forEach((reportData, index) => {
        const id = reportData.id;
        const time = new Date(reportData.timestamp).toLocaleTimeString();
        const data = reportData.data;
        const fmt = data.output_format || (data.html ? 'html' : (data.chart ? 'chart' : 'text'));
        
        const formatLabels = { chart: '📊 Chart', svg: '🎨 SVG', d3: '🔮 D3', html: '📄 HTML', mixed: '🧩 Mixed', text: '📝 Text' };
        const formatBadgeClass = `badge-${['chart','svg','d3','html','mixed'].includes(fmt) ? fmt : 'html'}`;
        
        const card = document.createElement('div');
        card.className = 'report-card';
        
        let contentHtml = '';
        
        // Title with format badge
        const titleText = data.title || data.chart?.title || '';
        const titleHtml = titleText ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h2 class="report-title" style="margin:0">${titleText}</h2><span class="format-badge ${formatBadgeClass}">${formatLabels[fmt] || fmt}</span></div>` : '';
        
        if (data.summary) {
          contentHtml += `<div class="report-summary">${data.summary}</div>`;
        }
        
        // SVG inline content
        if (data.svg || data.svg_content) {
          contentHtml += `<div class="svg-inline-container" id="svg-inline-${id}"></div>`;
        }
        
        // D3 script
        if (data.d3_script) {
          contentHtml += `<div id="d3-container-${id}" style="min-height:300px;background:rgba(255,255,255,0.02);border-radius:8px;padding:16px;margin:12px 0"></div>`;
        }
        
        // HTML iframe content
        if (data.html || data.html_content) {
          contentHtml += `<div id="html-container-${id}" style="margin-top: 16px;"></div>`;
        }
        
        // Chart.js
        if (data.chart) {
          contentHtml += `<div class="chart-container"><canvas id="chart-${id}"></canvas></div>`;
        }
        
        // Artifact download links
        if (data.download_url) {
          const urls = Array.isArray(data.download_url) ? data.download_url : [data.download_url];
          const artifactNames = Array.isArray(data.artifact_names) ? data.artifact_names : (data.artifact_name ? [data.artifact_name] : urls.map((_,i) => `Download ${i+1}`));
          contentHtml += urls.map((url, i) => {
            const name = artifactNames[i] || 'Download';
            const ext = (url.split('.').pop() || '').toLowerCase();
            const icon = { svg:'🎨', csv:'📊', json:'📋', png:'🖼️', pdf:'📕', html:'🌐', zip:'📦' }[ext] || '📎';
            return `<a class="artifact-link" href="${url}" target="_blank" download>${icon} ${name} (${ext.toUpperCase()})</a>`;
          }).join(' ');
        }
        
        // Fallback for unknown data
        if (!data.html && !data.chart && !data.svg && !data.d3_script && !data.summary && !data.download_url && typeof data !== 'string') {
          if (Object.keys(data).length > 0) {
            contentHtml += `<pre style="white-space:pre-wrap;font-family:monospace;background:#000;padding:12px;border-radius:6px;">${JSON.stringify(data, null, 2)}</pre>`;
          }
        } else if (typeof data === 'string' && !data.html) {
          contentHtml += `<pre style="white-space:pre-wrap;font-family:inherit;">${data}</pre>`;
        }
        
        card.innerHTML = `
          <div class="report-header">
            <span>Report #${id.slice(-6)}</span>
            <span>${time}</span>
          </div>
          ${titleHtml}
          ${contentHtml}
        `;
        
        container.appendChild(card);
        
        // ── Render dynamic content ──
        
        // HTML content in iframe
        const htmlContent = data.html || data.html_content;
        if (htmlContent) {
          const htmlContainer = document.getElementById(`html-container-${id}`);
          if (htmlContainer) {
            if (htmlContent.includes('<html') || htmlContent.includes('<script') || htmlContent.includes('<svg')) {
              const iframe = document.createElement('iframe');
              iframe.style.width = '100%';
              // Auto-size: taller for SVG/D3 reports
              const isSvg = htmlContent.includes('<svg');
              const isD3 = htmlContent.includes('d3js.org') || htmlContent.includes('d3.v7');
              iframe.style.height = (isSvg || isD3) ? '700px' : '600px';
              iframe.style.border = '1px solid var(--border)';
              iframe.style.borderRadius = '8px';
              iframe.style.backgroundColor = '#fff';
              iframe.srcdoc = htmlContent;
              // Allow fullscreen for interactive D3
              if (isD3) iframe.allow = 'fullscreen';
              htmlContainer.appendChild(iframe);
            } else {
              htmlContainer.innerHTML = htmlContent;
            }
          }
        }
        
        // SVG inline
        const svgContent = data.svg || data.svg_content;
        if (svgContent) {
          const svgContainer = document.getElementById(`svg-inline-${id}`);
          if (svgContainer) {
            svgContainer.innerHTML = svgContent;
          }
        }
        
        // D3 rendering
        if (data.d3_script) {
          const d3Container = document.getElementById(`d3-container-${id}`);
          if (d3Container) {
            try {
              const fn = new Function('container', 'data', 'd3', data.d3_script);
              fn(d3Container, data.d3_data || {}, d3);
            } catch(e) {
              d3Container.innerHTML = `<p style="color:#ef4444">D3 Error: ${e.message}</p>`;
            }
          }
        }
        
        // Render chart if it exists
        if (data.chart) {
          const ctx = document.getElementById(`chart-${id}`);
          if (ctx) renderChart(ctx, data.chart);
        }
      });
    }
    
    function renderChart(ctx, chartDef) {
      const { type, data, xKey, yKey, title } = chartDef;
      
      // Chart.js type mapping
      const chartType = type === 'pie' ? 'pie' : (type === 'line' ? 'line' : 'bar');
      
      const labels = data.map(d => d[xKey || 'name']);
      const values = data.map(d => d[yKey || 'value']);
      
      const backgroundColors = [
        'rgba(59, 130, 246, 0.8)', // blue
        'rgba(16, 185, 129, 0.8)', // green
        'rgba(245, 158, 11, 0.8)', // yellow
        'rgba(239, 68, 68, 0.8)',  // red
        'rgba(139, 92, 246, 0.8)', // purple
        'rgba(236, 72, 153, 0.8)', // pink
        'rgba(6, 182, 212, 0.8)',  // cyan
      ];
      
      new Chart(ctx, {
        type: chartType,
        data: {
          labels: labels,
          datasets: [{
            label: title || 'Dataset',
            data: values,
            backgroundColor: chartType === 'pie' ? backgroundColors : 'rgba(59, 130, 246, 0.8)',
            borderColor: chartType === 'pie' ? '#1a2332' : 'rgba(59, 130, 246, 1)',
            borderWidth: chartType === 'pie' ? 2 : 1,
            borderRadius: chartType === 'bar' ? 4 : 0,
            tension: 0.4 // curve for lines
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: chartType === 'pie',
              position: 'right',
              labels: { color: '#e2e8f0' }
            }
          },
          scales: chartType === 'pie' ? {} : {
            y: {
              beginAtZero: true,
              grid: { color: '#1e293b' },
              ticks: { color: '#94a3b8' }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8' }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
