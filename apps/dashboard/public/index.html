<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Agent Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a2332;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary: #10b981;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: var(--card-bg);
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 span {
      background: var(--primary);
      color: #000;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .report-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .report-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .report-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }
    .report-summary {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
      color: #cbd5e1;
    }
    .chart-container {
      height: 350px;
      position: relative;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state div {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .btn {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn:hover { background: #334155; }
    
    /* Loading indicator */
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Global Agent Dashboard <span>Live</span></h1>
    <div>
      <span class="pulse"></span><span style="font-size: 13px; color: var(--text-muted); margin-right: 16px;">Waiting for reports...</span>
      <button class="btn" onclick="clearReports()">Clear History</button>
    </div>
  </div>

  <div class="container" id="reports-container">
    <div class="empty-state">
      <div>📊</div>
      <h3>No reports yet</h3>
      <p>Ask an agent to push a report to the dashboard integration.</p>
    </div>
  </div>

  <script>
    // Configuration for Chart.js
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    
    let currentReports = [];
    
    // Poll for new reports every 2 seconds
    setInterval(fetchReports, 2000);
    fetchReports();
    
    async function fetchReports() {
      try {
        const res = await fetch('/api/reports');
        const reports = await res.json();
        
        // Only re-render if we have new reports
        if (JSON.stringify(reports) !== JSON.stringify(currentReports)) {
          currentReports = reports;
          renderReports();
        }
      } catch (err) {
        console.error('Failed to fetch reports:', err);
      }
    }
    
    async function clearReports() {
      await fetch('/api/reports/clear', { method: 'POST' });
      fetchReports();
    }
    
    function renderReports() {
      const container = document.getElementById('reports-container');
      
      if (currentReports.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div>📊</div>
            <h3>No reports yet</h3>
            <p>Ask an agent to push a report to the dashboard integration.</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = '';
      
      currentReports.forEach((reportData, index) => {
        const id = reportData.id;
        const time = new Date(reportData.timestamp).toLocaleTimeString();
        const data = reportData.data;
        
        const card = document.createElement('div');
        card.className = 'report-card';
        
        let contentHtml = '';
        
        if (data.summary) {
          contentHtml += `<div class="report-summary">${data.summary}</div>`;
        }
        
        if (data.html) {
          contentHtml += `<div id="html-container-${id}" style="margin-top: 16px;"></div>`;
        }
        
        if (data.chart) {
          contentHtml += `
            <div class="chart-container">
              <canvas id="chart-${id}"></canvas>
            </div>
          `;
        } else if (!data.html && typeof data === 'string') {
           contentHtml += `<pre style="white-space: pre-wrap; font-family: inherit;">${data}</pre>`;
        } else if (!data.html && Object.keys(data).length > 0 && !data.summary) {
           contentHtml += `<pre style="white-space: pre-wrap; font-family: monospace; background: #000; padding: 12px; border-radius: 6px;">${JSON.stringify(data, null, 2)}</pre>`;
        }
        
        card.innerHTML = `
          <div class="report-header">
            <span>Report ID: ${id}</span>
            <span>${time}</span>
          </div>
          ${data.chart?.title ? `<h2 class="report-title">${data.chart.title}</h2>` : ''}
          ${contentHtml}
        `;
        
        container.appendChild(card);
        
        // Render dynamic HTML
        if (data.html) {
          const htmlContainer = document.getElementById(`html-container-${id}`);
          if (data.html.includes('<html') || data.html.includes('<script')) {
            const iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            iframe.style.border = '1px solid var(--border)';
            iframe.style.borderRadius = '8px';
            iframe.style.backgroundColor = '#fff'; // White bg for iframes so default text is visible
            iframe.srcdoc = data.html;
            htmlContainer.appendChild(iframe);
          } else {
            htmlContainer.innerHTML = data.html;
          }
        }
        
        // Render chart if it exists
        if (data.chart) {
          const ctx = document.getElementById(`chart-${id}`);
          renderChart(ctx, data.chart);
        }
      });
    }
    
    function renderChart(ctx, chartDef) {
      const { type, data, xKey, yKey, title } = chartDef;
      
      // Chart.js type mapping
      const chartType = type === 'pie' ? 'pie' : (type === 'line' ? 'line' : 'bar');
      
      const labels = data.map(d => d[xKey || 'name']);
      const values = data.map(d => d[yKey || 'value']);
      
      const backgroundColors = [
        'rgba(59, 130, 246, 0.8)', // blue
        'rgba(16, 185, 129, 0.8)', // green
        'rgba(245, 158, 11, 0.8)', // yellow
        'rgba(239, 68, 68, 0.8)',  // red
        'rgba(139, 92, 246, 0.8)', // purple
        'rgba(236, 72, 153, 0.8)', // pink
        'rgba(6, 182, 212, 0.8)',  // cyan
      ];
      
      new Chart(ctx, {
        type: chartType,
        data: {
          labels: labels,
          datasets: [{
            label: title || 'Dataset',
            data: values,
            backgroundColor: chartType === 'pie' ? backgroundColors : 'rgba(59, 130, 246, 0.8)',
            borderColor: chartType === 'pie' ? '#1a2332' : 'rgba(59, 130, 246, 1)',
            borderWidth: chartType === 'pie' ? 2 : 1,
            borderRadius: chartType === 'bar' ? 4 : 0,
            tension: 0.4 // curve for lines
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: chartType === 'pie',
              position: 'right',
              labels: { color: '#e2e8f0' }
            }
          },
          scales: chartType === 'pie' ? {} : {
            y: {
              beginAtZero: true,
              grid: { color: '#1e293b' },
              ticks: { color: '#94a3b8' }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8' }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
