<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dental Chart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chart { display: flex; justify-content: space-between; }
        .tooth { width: 40px; height: 60px; margin: 5px; background: #eee; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .tooth.active { background: #007bff; color: white; }
        .info { margin-top: 20px; }
        .info h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Dental Chart</h1>
    <div class="chart" id="chart">
        <!-- Teeth will be inserted here -->
    </div>
    <div class="info" id="info">
        <h2>Information</h2>
        <p id="infoText">Click on a tooth to select it.</p>
    </div>

    <script>
        const teeth = [
            { id: '1', side: 'left' }, { id: '2', side: 'left' }, { id: '3', side: 'left' },
            { id: '4', side: 'left' }, { id: '5', side: 'left' }, { id: '6', side: 'left' },
            { id: '7', side: 'left' }, { id: '8', side: 'left' }, { id: '9', side: 'left' },
            { id: '10', side: 'right' }, { id: '11', side: 'right' }, { id: '12', side: 'right' },
            { id: '13', side: 'right' }, { id: '14', side: 'right' }, { id: '15', side: 'right' },
            { id: '16', side: 'right' }, { id: '17', side: 'right' }, { id: '18', side: 'right' },
            { id: '19', side: 'right' }, { id: '20', side: 'right' }
        ];

        const chart = document.getElementById('chart');
        const infoText = document.getElementById('infoText');

        teeth.forEach(tooth => {
            const div = document.createElement('div');
            div.className = 'tooth';
            div.textContent = tooth.id;
            div.dataset.id = tooth.id;
            div.dataset.side = tooth.side;
            div.addEventListener('click', () => selectTooth(tooth));
            chart.appendChild(div);
        });

        let selectedTooth = null;

        function selectTooth(tooth) {
            if (selectedTooth) {
                const selectedDiv = document.querySelector(`.tooth[data-id="${selectedTooth.id}"]`);
                selectedDiv.classList.remove('active');
            }
            selectedTooth = tooth;
            const div = document.querySelector(`.tooth[data-id="${tooth.id}"]`);
            div.classList.add('active');
            infoText.textContent = `Selected: ${tooth.id} (${tooth.side} side)`;
        }
    </script>
</body>
</html>
