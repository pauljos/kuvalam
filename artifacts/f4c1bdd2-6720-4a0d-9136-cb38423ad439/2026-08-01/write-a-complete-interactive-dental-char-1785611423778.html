<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dental Chart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .chart {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
        }
        .arch {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
        }
        .tooth {
            width: 40px;
            height: 60px;
            background-color: #ccc;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.3s;
        }
        .tooth:hover {
            background-color: #e0e0e0;
        }
        .tooth-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: #333;
        }
        .stats {
            margin-top: 20px;
            text-align: center;
        }
        .stats h2 {
            margin: 0 0 10px 0;
        }
        .stats p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dental Chart</h1>
        <div class="chart">
            <div class="arch">
                <div class="tooth" onclick="toggleState('18')"><div class="tooth-text">18</div></div>
                <div class="tooth" onclick="toggleState('17')"><div class="tooth-text">17</div></div>
                <div class="tooth" onclick="toggleState('16')"><div class="tooth-text">16</div></div>
                <div class="tooth" onclick="toggleState('15')"><div class="tooth-text">15</div></div>
