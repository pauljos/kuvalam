<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const teeth = document.querySelectorAll('.tooth');
      teeth.forEach(tooth => {
        tooth.addEventListener('click', () => {
          const states = ['Healthy', 'Cavity', 'Filling', 'Crown'];
          const currentIndex = states.indexOf(tooth.getAttribute('data-state') || 'Healthy');
          const nextIndex = (currentIndex + 1) % states.length;
          tooth.setAttribute('data-state', states[nextIndex]);
          tooth.style.fill = {
            'Healthy': '#4CAF50',
            'Cavity': '#F44336',
            'Filling': '#2196F3',
            'Crown': '#FFD700'
          }[states[nextIndex]];
        });
      });
    });
  </script>
  <text x="10" y="50" font-size="12">Legend: Healthy (Green) | Cavity (Red) | Filling (Blue) | Crown (Yellow)</text>
  <circle cx="20" cy="200" r="10" class="tooth" data-id="1" />
  <circle cx="40" cy="200" r="10" class="tooth" data-id="2" />
  <circle cx="60" cy="200" r="10" class="tooth" data-id="3" />
  <circle cx="80" cy="200" r="10" class="tooth" data-id="4" />
  <circle cx="100" cy="200" r="10" class="tooth" data-id="5" />
  <circle cx="120" cy="200" r="10" class="tooth" data-id="6" />
  <circle cx="140" cy="200" r="10" class="tooth" data-id="7" />
  <circle cx="160" cy="200" r="10" class="tooth" data-id="8" />
  <circle cx="180" cy="200" r="10" class="tooth" data-id="9" />
  <circle cx="200" cy="200" r="10" class="tooth" data-id="10" />
  <circle cx="220" cy="200" r="10" class="tooth" data-id="11" />
  <circle cx="240" cy="200" r="10" class="tooth" data-id="12" />
  <circle cx="260" cy="200" r="10" class="tooth" data-id="13" />
